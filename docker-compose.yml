services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "IndustIoT@2026!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'IndustIoT@2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Aplica as migrations automaticamente na subida do container.
      AplicarMigracoes: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=IndustIoT;User Id=sa;Password=IndustIoT@2026!;TrustServerCertificate=True"
    ports:
      - "8080:8080"
